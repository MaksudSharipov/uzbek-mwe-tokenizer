[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbek-mwe-tokenizer"
version = "0.1.1"
description = "A Python library for Transformer-based multi-word expression identification in Uzbek."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Maksud Sharipov", email = "maqsbek72@gmail.com" },
    { name = "Abdusobir Saidov", email = "abdusobir59@gmail.com" },
    { name = "Azizbek Ruzmetov", email = "a.ruzmetov@kiut.uz" },
    { name = "Shukurla Bekchanov", email = "bekchanov.sh@mamunedu.uz" },
    { name = "Ogabek Sobirov", email = "o.sobirov@tsue.uz" },
    { name = "Surayyo Sattarova", email = "surayyosattarova20@gmail.com" },
]
keywords = [
    "multi-word expressions",
    "Uzbek NLP",
    "tokenization",
    "Transformer",
    "UzBERT",
    "syntactic disambiguation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=1.9.0",
    "transformers>=4.20.0",
    "UzTransliterator",
    "sentencepiece>=0.1.96",
]

[project.urls]
Homepage = "https://github.com/MaksudSharipov/uzbek-mwe-tokenizer"
Repository = "https://github.com/MaksudSharipov/uzbek-mwe-tokenizer"
PyPI = "https://pypi.org/project/uzbek-mwe-tokenizer/"
Model = "https://huggingface.co/MaksudSharipov/Uzbek-MWE-Tokenizer-uzBERT"
Issues = "https://github.com/MaksudSharipov/uzbek-mwe-tokenizer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["uzbek_mwe_tokenizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
